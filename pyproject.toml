[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rfmapping-analysis"
version = "0.1.0"
description = "RF mapping analysis models, detection, and raw-trial reconstruction"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2,<3",
  "scipy>=1.14,<2",
  "tqdm>=4.66,<5",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
analysis = [
  "ipython>=8,<10",
  "matplotlib>=3.9,<4",
  "numba>=0.61,<1",
  "pynapple>=0.9,<1",
  "pandas>=2.2,<4",
]

waveform = [
  "matplotlib>=3.9,<4",
  "neo>=0.14.5,<0.15",
  "pandas>=2.2,<4",
  "spikeinterface>=0.104.8,<0.105",
  "probeinterface>=0.3.2,<0.4",
]
video = [
  "numba>=0.61,<1",
  "pandas>=2.2,<4",
  "pynapple>=0.9,<1",
  "pillow>=11,<13",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["Utils*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
